name: Bug
# description: 当你在代码中发现了一个 Bug，导致应用崩溃或抛出异常，或者有一个组件存在问题，或者某些地方看起来不对劲。
title: "[标题]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # 感谢对项目的支持与关注。在提出问题之前，请确保你已查看相关开发或使用文档：
        # - https://...
  - type: checkboxes
    attributes:
      label: 这个问题是否已经存在？
      options:
        - label: 我已经搜索过现有的问题 (https://gitee.com/../../issues)
          required: true
  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: |
        # 1. ...
        # 2. ...
        # 3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 附件截图
      value: |
        # [在这里上传图片]
#   - type: dropdown
#     id: version
#     attributes:
#       label: 版本
#       description: 你当前正在使用我们软件的哪个版本/分支？
#       options:
#         - 1.0.2 (默认)
#         - 1.0.3 (最新)
