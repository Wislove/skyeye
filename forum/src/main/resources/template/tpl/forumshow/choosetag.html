<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>选择标签</title>
    <link href="../../assets/lib/layui/css/layui.css" rel="stylesheet" />
    <link href="../../assets/lib/winui/css/winui.css" rel="stylesheet" />
    <style>
        .choosetag {
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .choosetag .layui-form-checkbox {
            margin: 5px 10px;
        }
    </style>
</head>

<body>
    <div style="float: left; width: 100%; height: 100%;">
        <div style="margin: 0px; float: left; width: 100%; height: calc(100% - 50px);">
            <form class="layui-form">
                <div id="showForm" class="choosetag">
                    <!-- 标签将在这里动态加载 -->
                </div>
            </form>
        </div>
        <div class="layui-form-item layui-col-xs12" style="margin: 10px;">
            <div class="layui-input-block">
                <button class="winui-btn" id="cancle">取消</button>
                <button class="winui-btn" type="button" id="confimChoose">确定</button>
            </div>
        </div>
    </div>

    <script src="../../assets/lib/layui/layui.js"></script>
    <script src="../../assets/lib/layui/custom.js"></script>
    <script type="text/javascript" src="../../assets/lib/layui/lay/modules/jquery-min.js"></script>
    <script type="text/javascript">
        layui.config({ base: '../../js/forumshow/' }).use('choosetag');
    </script>

    <!-- 修改模板以适应新的数据结构 -->
    <script type="text/x-handlebars-template" id="addListTemplate">
    {{#each rows}}
        <div class="caller-item">
            <div class="forum-main caller-fl" rowId='{{id}}'>
                <p><span class="my-forum-main-span">{{tagName}}</span></p>
            </div>
        </div>
    {{/each}}
    </script>
</body>

</html>
